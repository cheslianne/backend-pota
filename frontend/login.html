<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — eSaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EDE1;
    --ink:#2E2A22;
    --green:#5B6B4F;
    --green-dark:#495a3f;
    --brown:#8C6A4A;
    --gold:#C9A15A;
    --error:#A6453C;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100vh;
    font-family:'Inter', sans-serif;
    background:var(--green);
    color:var(--ink);
  }

  .frame{
    min-height:100vh;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green);
  }

  .page-inner{
    width:100%;
    max-width:1010px;
    background:var(--cream);
    padding:36px 40px 50px;
    border-radius:6px;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:26px;
  }

  .brand svg{ width:130px; height:112px; flex-shrink:0; }

  .brand-word{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:54px;
    color:var(--green);
    line-height:1;
    margin-left:-14px;
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,0.2));
  }

  .card{
    background:#D8D5CD;
    max-width:660px;
    margin:0 auto;
    padding:44px 55px 32px;
    border-radius:4px;
    box-shadow:0 12px 28px rgba(0,0,0,0.15);
  }

  .field-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
  }

  .field-row label{
    width:75px;
    flex-shrink:0;
    font-size:15px;
    color:var(--ink);
  }

  .field-row .field-wrap{ flex:1; }

  .field-row input{
    width:100%;
    padding:11px 14px;
    font-size:14px;
    font-family:'Inter', sans-serif;
    border:1.5px solid var(--ink);
    border-radius:4px;
    background:#F4F2ED;
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }

  .field-row input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(91,107,79,0.15);
  }

  .field-row input.invalid{ border-color:var(--error); }

  .error-msg{
    display:none;
    font-size:12px;
    color:var(--error);
    margin-top:5px;
  }

  .field-row.has-error .error-msg{ display:block; }

  .forgot-row{
    text-align:center;
    margin-bottom:24px;
  }

  .forgot-row a{
    font-size:13px;
    color:var(--ink);
    text-decoration:underline;
  }

  .forgot-row a:hover{ color:var(--green); }

  .login-btn-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }

  .btn-login{
    width:100%;
    max-width:210px;
    appearance:none;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:19px;
    font-weight:500;
    padding:13px 28px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
  }

  .btn-login:hover,
  .btn-login:focus-visible{
    background-color:var(--green);
    border-color:var(--green);
    color:#fff;
  }

  .btn-login:active{ transform:translateY(1px); }

  .home-row{ text-align:center; }

  .home-row a{
    font-size:12.5px;
    color:var(--ink);
    text-decoration:underline;
  }

  .home-row a:hover{ color:var(--green); }

  .form-status{
    display:none;
    background:#EEF3EA;
    border:1px solid #B9CCA9;
    color:#3d5540;
    font-size:13px;
    padding:9px 14px;
    border-radius:5px;
    margin-bottom:18px;
    text-align:center;
  }

  .form-status.error{
    background:#FDECEA;
    border-color:#F5C6CB;
    color:var(--error);
  }

  .form-status.show{ display:block; }

  @media (max-width: 640px){
    .page-inner{ padding:26px 18px 34px; }
    .card{ padding:30px 24px 24px; }
    .brand svg{ width:90px; height:78px; }
    .brand-word{ font-size:38px; }
    .field-row{ flex-direction:column; align-items:flex-start; gap:6px; }
    .field-row label{ width:auto; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="page-inner">

    <div class="brand">
      <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#8C6A4A" stroke-width="2.5" stroke-linecap="round">
          <path d="M8 90 C 40 40, 90 20, 150 15"/>
          <path d="M8 90 C 45 55, 95 40, 155 45"/>
          <path d="M8 90 C 50 78, 100 72, 158 82"/>
          <path d="M8 90 C 45 105, 95 118, 150 130"/>
          <path d="M8 90 C 40 130, 85 150, 130 158"/>
        </g>
        <g fill="none" stroke="#C9A15A" stroke-width="1.5" opacity="0.7">
          <path d="M160 12 c 6 4, 10 10, 8 18"/>
        </g>
      </svg>
      <span class="brand-word">eSaka</span>
    </div>

    <div class="card">
      <div class="form-status" id="formStatus"></div>

      <form id="loginForm" novalidate>
        <div class="field-row" id="emailField">
          <label for="email">Email</label>
          <div class="field-wrap">
            <input type="text" id="email" name="email" autocomplete="username" placeholder="Username or email">
            <p class="error-msg" id="emailError">Enter your username or email.</p>
          </div>
        </div>

        <div class="field-row" id="passwordField">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
            <p class="error-msg" id="passwordError">Enter your password.</p>
          </div>
        </div>

        <div class="forgot-row">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <div class="login-btn-wrap">
          <button class="btn-login" type="submit">Login</button>
        </div>

        <div class="home-row">
          <a href="index.html">Return to Homescreen</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="assets/js/login.js"></script>
</body>
</html>
