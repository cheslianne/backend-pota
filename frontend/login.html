<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — eSaka</title>




<!-- Modern Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">




<link rel="stylesheet" href="assets/css/base.css">




<style>
  :root {
    --cream: #F2EDE1;
    --white: #FBF8F1;
    --ink: #2E2A22;
    --muted: #625E52;
    --border: #DFD8C6;
    --border-light: #ECE5D4;
    --green: #5B6B4F;
    --green-dark: #445439;
    --green-light: #E7EDDF;
    --brown: #C08A4E;
    --error: #A51D24;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }




  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }




  html,
  body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--ink);
    background:
      linear-gradient(rgba(46, 60, 40, 0.65), rgba(46, 60, 40, 0.75)),
      url('images/esakapic.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }




  .frame {
    width: 95%;
    max-width: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
  }




  .page-inner {
    width: 100%;
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 50px rgba(20, 35, 15, 0.35);
    padding: 46px 52px 42px;
    animation: fadeIn 0.3s ease-in-out;
  }




  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }




  /* --- BRAND LOGOS --- */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }




  .brand-logo-img {
    height: 80px;
    width: auto;
    object-fit: contain;
    display: block;
  }




  .brand-name-img {
    height: 82px;
    width: auto;
    object-fit: contain;
    display: block;
  }




  /* --- CARD INNER --- */
  .card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 38px 44px 32px;
  }




  .card h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--green);
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 28px;
  }




  .form-status {
    display: none;
    background: var(--green-light);
    border: 1.5px solid #C4D3B8;
    color: var(--green-dark);
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    text-align: center;
  }




  .form-status.error {
    background: #FCE8E6;
    border-color: #F5C2C7;
    color: var(--error);
  }




  .form-status.show {
    display: block;
  }




  .field-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 20px;
  }




  .field {
    display: flex;
    flex-direction: column;
  }




  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }




  .field .field-wrap {
    position: relative;
    width: 100%;
  }




  .field input {
    width: 100%;
    padding: 13px 18px;
    font-size: 14.5px;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }




  .field input#password {
    padding-right: 48px;
  }




  .field input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3.5px rgba(91, 107, 79, 0.16);
  }




  .field input.invalid {
    border-color: var(--error);
  }




  .toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: color 0.2s ease;
  }




  .toggle-password:hover {
    color: var(--green);
  }




  .toggle-password svg {
    width: 20px;
    height: 20px;
  }




  .error-msg {
    display: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--error);
    margin-top: 6px;
  }




  .field.has-error .error-msg {
    display: block;
  }




  .forgot-row {
    text-align: right;
    margin-top: -6px;
    margin-bottom: 24px;
  }




  .forgot-row a {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }




  .forgot-row a:hover {
    color: var(--green);
    text-decoration: underline;
  }




  .login-btn-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }




  .btn-login {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 28px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--green);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
  }




  .btn-login:hover {
    background: var(--green-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(68, 84, 57, 0.25);
  }




  .btn-login:active {
    transform: translateY(0);
  }




  .home-row {
    text-align: center;
  }




  .home-row a {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }




  .home-row a:hover {
    color: var(--green);
    text-decoration: underline;
  }




  @media (max-width: 640px) {
    .page-inner {
      padding: 32px 22px 28px;
    }
    .card {
      padding: 28px 20px 24px;
    }
    .brand-logo-img {
      height: 64px;
    }
    .brand-name-img {
      height: 66px;
    }
    .card h1 {
      font-size: 20px;
    }
  }
 
  /* ======================================== */
  /* ===== IDINAGDAG NA CODE ===== */
  /* ======================================== */
 
  /* Hide browser's default password toggle eye */
  input[type="password"]::-webkit-reveal,
  input[type="password"]::-ms-reveal {
    display: none !important;
  }


  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-caps-lock-indicator,
  input[type="password"]::-webkit-textfield-decoration-container {
    display: none !important;
  }


  input[type="password"] {
    -webkit-text-security: disc;
  }


  /* ======================================== */
</style>
</head>
<body>




<div class="frame">
  <div class="page-inner">




    <!-- BRAND LOGOS -->
    <div class="brand">
      <img src="images/esakalogo.png" alt="eSaka Logo" class="brand-logo-img">
      <img src="images/esakaname.png" alt="eSaka" class="brand-name-img">
    </div>




    <!-- CARD -->
    <div class="card">
      <h1>Account Login</h1>




      <div class="form-status" id="formStatus"></div>




      <form id="loginForm" novalidate>
        <div class="field-group">
         
          <div class="field" id="emailField">
            <label for="email">Username</label>
            <div class="field-wrap">
              <input type="text" id="email" name="email" autocomplete="username" placeholder="Enter your username">
              <p class="error-msg" id="emailError">Enter your username.</p>
            </div>
          </div>




          <div class="field" id="passwordField">
            <label for="password">Password</label>
            <div class="field-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
              <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <!-- Closed eye by default (hidden password) -->
                <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <!-- Open eye when unhidden -->
                <svg id="eyeIcon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
              <p class="error-msg" id="passwordError">Enter your password.</p>
            </div>
          </div>




        </div>




        <div class="forgot-row">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>




        <div class="login-btn-wrap">
          <button class="btn-login" type="submit">Login</button>
        </div>




        <div class="home-row">
          <a href="index.html">Return to Homescreen</a>
        </div>
      </form>
    </div>




  </div>
</div>




<script src="assets/js/login.js"></script>
</body>
</html>
