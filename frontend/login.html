<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — eSaka</title>
<script src="assets/js/config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #506747;
  --green-dark: #354d30;
  --green-light: #E7EDDF;
  --cream: #f8f5eb;
  --white: #FBF8F1;
  --text: #34402f;
  --ink: #2E2A22;
  --muted: #85897d;
  --border: #ddd8c8;
  --error: #A51D24;
  --radius-sm: 8px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: "Plus Jakarta Sans", sans-serif;
  overflow: hidden;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* =================================================
   BACKGROUND SLIDESHOW
================================================= */
.background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transform: scale(1.04);
  transition: opacity 1.5s ease, transform 6s ease;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
}

.slide:nth-child(1) { background-image: url("images/esakabg.jpg"); }
.slide:nth-child(2) { background-image: url("images/esakabg2.jpg"); }
.slide:nth-child(3) { background-image: url("images/esakabg3.avif"); }

/* =================================================
   VIGNETTE + CENTER LIGHT
================================================= */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at center,
      rgba(248,245,235,0.25) 0%,
      rgba(248,245,235,0.42) 35%,
      rgba(42,55,36,0.30) 100%
    );
}

.center-light {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at center,
      rgba(255,253,245,0.35) 0%,
      rgba(255,253,245,0.10) 45%,
      transparent 72%
    );
}

/* =================================================
   PAGE
================================================= */
.page {
  position: relative;
  z-index: 5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

/* =================================================
   CARD (glass)
================================================= */
.login-card {
  width: 100%;
  max-width: 430px;
  padding: 34px 35px 29px;
  background: rgba(250, 248, 240, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 17px;
  box-shadow:
    0 25px 60px rgba(39,52,34,0.20),
    0 3px 10px rgba(39,52,34,0.08);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: cardIn .6s ease;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(15px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* =================================================
   LOGO
================================================= */
.logo {
  display: block;
  width: 82px;
  height: 82px;
  object-fit: contain;
  margin: 0 auto 10px;
}

/* =================================================
   HEADER
================================================= */
.header {
  text-align: center;
  margin-bottom: 24px;
}

.header h1 {
  font-size: 22px;
  font-weight: 800;
  color: var(--green-dark);
  margin-bottom: 5px;
}

.header p {
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
}

/* =================================================
   FORM STATUS
================================================= */
.form-status {
  display: none;
  background: var(--green-light);
  border: 1.5px solid #C4D3B8;
  color: var(--green-dark);
  font-size: 12px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  text-align: center;
}

.form-status.error {
  background: #FCE8E6;
  border-color: #F5C2C7;
  color: var(--error);
}

.form-status.show {
  display: block;
}

/* =================================================
   FIELDS
================================================= */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 8px;
}

.field {
  margin-bottom: 0;
}

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text);
}

.field-wrap {
  position: relative;
}

.field input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.65);
  outline: none;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  transition: .2s;
}

.field input:focus {
  background: white;
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(80, 103, 71, 0.10);
}

.field input::placeholder {
  color: #aaa99f;
}

.field input.invalid {
  border-color: var(--error);
}

/* =================================================
   PASSWORD
================================================= */
#password {
  padding-right: 42px;
}

.toggle-password {
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #777e72;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s ease;
}

.toggle-password:hover {
  color: var(--green);
}

.toggle-password svg {
  width: 17px;
  height: 17px;
}

/* =================================================
   ERROR MSG
================================================= */
.error-msg {
  display: none;
  font-size: 11px;
  font-weight: 600;
  color: var(--error);
  margin-top: 5px;
}

.field.has-error .error-msg {
  display: block;
}

/* =================================================
   FORGOT
================================================= */
.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
  margin-bottom: 20px;
}

.forgot-row a {
  font-size: 10px;
  font-weight: 600;
  color: #72796e;
  text-decoration: none;
  transition: color 0.2s ease;
}

.forgot-row a:hover {
  color: var(--green);
  text-decoration: underline;
}

/* =================================================
   BUTTON
================================================= */
.login-btn-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.btn-login,
.login-btn {
  width: 100%;
  height: 42px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--green);
  color: white;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.btn-login:hover,
.login-btn:hover {
  background: var(--green-dark);
  transform: translateY(-1px);
  box-shadow: 0 7px 18px rgba(45, 66, 39, 0.22);
}

.btn-login:active,
.login-btn:active {
  transform: translateY(0);
}

/* =================================================
   HOME
================================================= */
.home-row {
  text-align: center;
}

.home-row a {
  color: #747b70;
  font-size: 10px;
  font-weight: 600;
  text-decoration: none;
}

.home-row a:hover {
  color: var(--green);
  text-decoration: underline;
}

/* =================================================
   BOTTOM BRAND
================================================= */
.branding {
  position: fixed;
  z-index: 6;
  left: 50%;
  bottom: 21px;
  transform: translateX(-50%);
  text-align: center;
}

.branding .name {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 20px;
  color: #66755e;
  margin-bottom: 2px;
}

.branding .tagline {
  color: #899285;
  font-size: 9px;
  font-weight: 500;
}

/* =================================================
   DOTS
================================================= */
.dots {
  position: fixed;
  z-index: 7;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
}

.dot {
  width: 6px;
  height: 6px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.65);
  cursor: pointer;
  transition: background 0.2s ease;
}

.dot.active {
  background: #64775b;
}

/* =================================================
   HIDE BROWSER DEFAULT PASSWORD EYE
================================================= */
input[type="password"]::-webkit-reveal,
input[type="password"]::-ms-reveal {
  display: none !important;
}

input[type="password"]::-webkit-credentials-auto-fill-button,
input[type="password"]::-webkit-caps-lock-indicator,
input[type="password"]::-webkit-textfield-decoration-container {
  display: none !important;
}

input[type="password"] {
  -webkit-text-security: disc;
}

/* =================================================
   MOBILE
================================================= */
@media (max-width: 600px) {
  .login-card {
    max-width: 390px;
    padding: 29px 25px;
  }
  .branding {
    display: none;
  }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="background">
  <div class="slide active"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<!-- VIGNETTE -->
<div class="vignette"></div>
<div class="center-light"></div>

<!-- LOGIN -->
<main class="page">
  <section class="login-card">

    <!-- LOGO -->
    <img src="images/esakalogo.png" alt="eSaka Logo" class="logo">

    <!-- HEADER -->
    <div class="header">
      <h1>Account Login</h1>
      <p>Sign in to access your eSaka account</p>
    </div>

    <!-- FORM STATUS (para sa JS) -->
    <div class="form-status" id="formStatus"></div>

    <!-- FORM -->
    <form id="loginForm" novalidate>
      <div class="field-group">

        <!-- USERNAME -->
        <div class="field" id="emailField">
          <label for="email">Username</label>
          <div class="field-wrap">
            <input
              type="text"
              id="email"
              name="email"
              autocomplete="username"
              placeholder="Enter your username"
            >
            <p class="error-msg" id="emailError">Enter your username.</p>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
            >
            <button
              type="button"
              class="toggle-password"
              id="togglePasswordBtn"
              aria-label="Toggle password visibility"
            >
              <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg id="eyeIcon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <p class="error-msg" id="passwordError">Enter your password.</p>
          </div>
        </div>

      </div>

      <!-- FORGOT -->
      <div class="forgot-row">
        <a href="forgot-password.html">Forgot Password?</a>
      </div>

      <!-- LOGIN -->
      <div class="login-btn-wrap">
        <button class="btn-login" type="submit">Login</button>
      </div>

      <!-- HOME -->
      <div class="home-row">
        <a href="index.html">Return to Homescreen</a>
      </div>

    </form>
  </section>
</main>

<!-- BRANDING -->
<div class="branding">
  <div class="name">eSaka</div>
  <div class="tagline">— Farmers • Communities • Progress —</div>
</div>

<!-- DOTS -->
<div class="dots">
  <button class="dot active" data-index="0"></button>
  <button class="dot" data-index="1"></button>
  <button class="dot" data-index="2"></button>
</div>

<!-- SLIDESHOW -->
<script>
  const slides = document.querySelectorAll(".slide");
  const dots = document.querySelectorAll(".dot");
  let current = 0;

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.toggle("active", i === index);
    });
    dots.forEach((dot, i) => {
      dot.classList.toggle("active", i === index);
    });
    current = index;
  }

  function nextSlide() {
    showSlide((current + 1) % slides.length);
  }

  setInterval(nextSlide, 3000);

  dots.forEach((dot) => {
    dot.addEventListener("click", () => {
      showSlide(Number(dot.dataset.index));
    });
  });
</script>

<!-- EXISTING LOGIN JS (compatible sa structure na ito) -->
<script src="assets/js/login.js"></script>

</body>
</html>
