<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Municipal Coordinator — eSaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>


<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    background:var(--cream);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:2100;
  }


  .topbar-left{ display:flex; align-items:center; gap:16px; }


  .hamburger{
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }


  .hamburger span{
    display:block;
    width:26px;
    height:3px;
    background:var(--ink);
    border-radius:2px;
  }


  .logos{ display:flex; align-items:center; gap:10px; }
  .seal{ width:44px; height:44px; }


  .brand-word{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:28px;
    color:var(--green);
    margin-left:-6px;
  }


  .brand-logo svg{ width:60px; height:50px; }


  .topbar-right{ display:flex; align-items:center; gap:18px; }


  .bell-wrap{
    position:relative;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }


  .bell-wrap svg{ width:18px; height:18px; fill:#fff; }


  .bell-dot{
    position:absolute;
    top:2px;
    right:2px;
    width:9px;
    height:9px;
    background:#C0392B;
    border-radius:50%;
    border:2px solid var(--cream);
  }


  .user-info{ display:flex; align-items:center; gap:10px; }
  .user-text{ text-align:right; line-height:1.25; }
  .user-name{ font-size:14px; font-weight:700; color:var(--ink); }
  .user-role{ font-size:12px; font-weight:600; color:var(--gold); }


  .avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#4a4a4a;
    display:flex;
    align-items:center;
    justify-content:center;
  }


  .avatar svg{ width:20px; height:20px; fill:#fff; }


  .layout{ display:flex; min-height:calc(100vh - 73px); }


  /* SIDEBAR STYLES */
  .sidebar{
    width:230px;
    background:var(--green);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 0;
    flex-shrink:0;
    position:fixed;
    top:73px;
    left:-230px;
    bottom:0;
    z-index:2000;
    transition:left .28s ease;
  }


  .sidebar.open{ left:0; }


  .nav-list{ display:flex; flex-direction:column; gap:2px; }


  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 24px;
    color:#fff;
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
  }


  .nav-item svg{ width:19px; height:19px; fill:#fff; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.08); }
  .nav-item.active{ background:var(--green-dark); font-weight:700; }


  .signout{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 24px;
    color:#fff;
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
  }


  .signout svg{ width:18px; height:18px; fill:#fff; }
  .signout:hover{ opacity:0.8; }


  .main{
    flex:1;
    padding:36px 40px;
    min-width:0;
  }


  .view{ display:none; }
  .view.active-view{ display:block; }


  .main-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:22px;
  }


  .main-header h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:36px;
    color:var(--green);
    letter-spacing:0.02em;
    margin:0;
  }


  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px 28px;
  }


  /* MAP DESIGN */
  #map{
    width:100%;
    height:360px;
    border-radius:8px;
    border:1px solid var(--border);
  }


  /* SEARCH & FILTER BAR */
  .search-row{ display:flex; gap:10px; align-items:center; }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:8px;
    padding:8px 14px;
    min-width:260px;
  }
  .search-box svg{ width:16px; height:16px; fill:none; stroke:var(--ink); stroke-width:2; }
  .search-box input{ border:none; outline:none; font-size:14px; width:100%; background:transparent; }


  /* TAB BUTTONS (SUMMARY / VIEW INDIVIDUAL / APPROVED / PENDING) */
  .tab-buttons-row{
    display:flex;
    gap:16px;
    margin-bottom:24px;
    align-items:center;
  }


  .tab-btn{
    padding:12px 24px;
    border:1.5px solid var(--ink);
    border-radius:8px;
    background:#EFEAE0;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition:all 0.2s ease;
  }


  .tab-btn:hover{ background:#DEDDDC; }
  .tab-btn.active{
    background:#C4C3C2;
    border-color:var(--ink);
  }


  /* SUMMARY TAB CONTENT DESIGN */
  .summary-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:24px;
  }


  .summary-left-box, .summary-right-card{
    background:#fff;
    border:1px solid #D0D0D0;
    border-radius:8px;
    padding:20px;
  }


  .summary-stat-chips{
    display:flex;
    gap:10px;
    margin:14px 0 20px;
    flex-wrap:wrap;
  }


  .stat-chip{
    padding:10px 14px;
    border-radius:8px;
    text-align:center;
    font-size:12px;
    font-weight:700;
    min-width:70px;
  }


  .stat-chip.gray{ background:#F2EFE9; border:1px solid #CCC; color:#333; }
  .stat-chip.black{ background:#000; color:#fff; }
  .stat-chip.green{ background:#0B823A; color:#fff; }
  .stat-chip.gold{ background:#D69E3D; color:#fff; }
  .stat-chip.red{ background:#B82218; color:#fff; }


  .stat-chip span{ display:block; font-size:14px; margin-top:2px; }


  .placeholder-line{
    height:24px;
    background:#F2EFE9;
    border-radius:4px;
    margin-bottom:10px;
  }


  .top-commodity-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:12px;
  }


  .top-commodity-img{
    width:120px;
    height:80px;
    background:#D6E5B3;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }


  /* TABLE COMMON DESIGN */
  table{ width:100%; border-collapse:separate; border-spacing:0; }
  thead tr{ background:#DEDDDC; }
  thead th{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#222;
    padding:14px 10px;
  }
  thead th:first-child{ border-top-left-radius:8px; border-bottom-left-radius:8px; }
  thead th:last-child{ border-top-right-radius:8px; border-bottom-right-radius:8px; }


  tbody td{
    padding:14px 8px;
    font-size:13.5px;
    text-align:center;
    vertical-align:middle;
  }


  .pill{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:#EEEEEE;
    font-size:12.5px;
    color:#222;
    white-space:nowrap;
  }


  .status-pill{
    display:inline-block;
    padding:6px 20px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
  }


  .status-pill.confirmed, .status-pill.approved, .status-pill.harvested{ background:#118308; }
  .status-pill.submitted, .status-pill.mediating{ background:#E5A510; }
  .status-pill.planted{ background:#E06030; }
  .status-pill.pending{ background:#C48D53; }


  /* REMARKS / NOTES SECTION */
  .notes-row{
    display:flex;
    gap:24px;
    align-items:flex-end;
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid #E0E0E0;
  }


  .notes-field{ flex:1; }
  .notes-field label{ display:block; font-size:14px; font-weight:700; margin-bottom:8px; color:var(--ink); }


  .btn-outline-report{
    appearance:none;
    border:1.5px solid #5A6B52;
    background:#EFEAE0;
    color:#333;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:10px 24px;
    border-radius:8px;
    cursor:pointer;
    transition:all .2s ease;
  }


  .btn-outline-report:hover:not(:disabled){ background:#DEDDDC; }


  .detail-actions-row{
    display:flex;
    justify-content:flex-end;
    gap:16px;
    margin-top:24px;
  }


  .flag-btn.active{ background:#C83232; border-color:#C83232; color:#fff; }
  .approve-btn.active{ background:#5A7365; border-color:#5A7365; color:#fff; }


  /* MODAL OVERLAY */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(30,35,28,0.55);
    align-items:center;
    justify-content:center;
    z-index:3000;
  }


  .modal-overlay.show{ display:flex; }


  .modal-box{
    background:#DEDDDC;
    border-radius:8px;
    padding:36px 48px;
    text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,0.3);
    max-width:480px;
    width:90%;
  }


  .modal-box p{
    font-family:'Oswald', sans-serif;
    font-size:28px;
    font-weight:700;
    color:#536B5C;
    margin-bottom:24px;
    line-height:1.25;
  }


  .modal-confirm-btn{
    border:none;
    background:#5A7365;
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 36px;
    border-radius:10px;
    cursor:pointer;
  }


  .clickable-row{ cursor:pointer; }
  .clickable-row:hover td{ background:#F6F3EB; }


  /* HELPER CLASSES PARANG WALA NANG INLINE STYLE WARNINGS */
  .text-loc { font-size: 12px; color: #666; }
  .text-section-title { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .text-alert-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .text-narrative-title { font-size: 13px; font-weight: 700; margin: 16px 0 8px; }
  .textarea-narrative { width: 100%; height: 80px; border: 1.5px solid #666; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; resize: vertical; }


  .text-top-commodity { font-size: 13px; font-weight: 700; }
  .text-green-highlight { color: #0B823A; }
  .top-commodity-text { font-size: 12.5px; line-height: 1.6; }
  .text-as-of { font-size: 11px; color: #888; text-align: right; margin-top: 20px; }


  .upload-section { margin-top: 28px; border-top: 1px solid #EEE; padding-top: 16px; }
  .upload-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .upload-flex { display: flex; gap: 8px; }
  .input-required { flex: 1; padding: 6px 10px; font-size: 12px; border: 1px solid #CCC; border-radius: 4px; }
  .btn-select-file { padding: 6px 12px; font-size: 12px; }


  .actions-right-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .btn-submit-bg { background: #E5E4E3; }


  .hidden-element { display: none; }
  .notes-row-clean { border-top: none; padding-top: 0; }
  .textarea-notes { width:100%; height:90px; padding:12px; font-size:14px; font-family:'Inter', sans-serif; border:1.5px solid #666; border-radius:4px; background:#fff; color:var(--ink); outline:none; resize:vertical; }
</style>

<script>
  // SIDEBAR & VIEW SWITCHING
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('sidebar');


  hamburgerBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    setTimeout(() => {
      if (window.leafletMap) window.leafletMap.invalidateSize();
    }, 300);
  });


  const navButtons = document.querySelectorAll('.nav-item[data-view]');
  const views = document.querySelectorAll('.view');


  function switchView(viewKey){
    views.forEach(v => v.classList.remove('active-view'));
    document.getElementById('view-' + viewKey).classList.add('active-view');
    navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === viewKey));


    if (viewKey === 'map' && window.leafletMap){
      setTimeout(() => window.leafletMap.invalidateSize(), 50);
    }
  }


  navButtons.forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });


  // MAP INITIALIZATION
  const pampangaBounds = L.latLngBounds([14.85, 120.35], [15.35, 120.95]);
  const map = L.map('map', {
    maxBounds: pampangaBounds,
    maxBoundsViscosity: 1.0,
    minZoom: 10
  }).setView([15.0794, 120.6200], 10);
  window.leafletMap = map;


  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  document.getElementById("approveBtn");




// ============================================================
// DATA
// ============================================================


let municipalReports = [];


let selectedReport = null;




// ============================================================
// LOAD REPORTS
// ============================================================


async function loadMunicipalReports() {


  if (!pendingReportsBody) {
    return;
  }


  pendingReportsBody.innerHTML = `
    <tr>
      <td colspan="6">
        Loading reports...
      </td>
    </tr>
  `;


  try {


    const response = await fetch(
      MUNICIPAL_REPORTS_ENDPOINT,
      {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      }
    );


    if (!response.ok) {
      throw new Error(
        `Failed to load reports. Status: ${response.status}`
      );
    }


    municipalReports = await response.json();


    console.log(
      "Municipal reports:",
      municipalReports
    );


    renderMunicipalReports(
      municipalReports
    );


  } catch (error) {


    console.error(
      "Error loading municipal reports:",
      error
    );


    pendingReportsBody.innerHTML = `
      <tr>
        <td colspan="6">
          Failed to load reports.
        </td>
      </tr>
    `;


  }


}




// ============================================================
// RENDER PENDING REPORTS
// ============================================================


function renderMunicipalReports(
  reports = municipalReports
) {


  if (!pendingReportsBody) {
    return;
  }


  pendingReportsBody.innerHTML = "";


  if (!reports || reports.length === 0) {


    pendingReportsBody.innerHTML = `
      <tr>
        <td colspan="6">
          No reports waiting for municipal validation.
        </td>
      </tr>
    `;


    return;
  }


  reports.forEach(report => {


    const row =
      document.createElement("tr");


    row.classList.add(
      "clickable-row"
    );


    row.dataset.id =
      report.report_id;


    row.innerHTML = `


      <td>
        <span class="pill">
          ${report.report_id ?? "—"}
        </span>
      </td>


      <td>
        <span class="pill">
          ${report.title || "Crop Harvest Report"}
        </span>
      </td>


      <td>
        <span class="pill">
          ${report.commodity || "—"}
        </span>
      </td>


      <td>
        <span class="pill">
          ${formatDate(report.planting_date)}
        </span>
      </td>


      <td>
        <span class="pill">
          ${report.estimated_yield ?? "—"}
        </span>
      </td>


      <td>
        <span class="status-pill pending">
          For Municipal Validation
        </span>
      </td>


    `;


    row.addEventListener(
      "click",
      () => openReportDetail(report)
    );


    pendingReportsBody.appendChild(row);


  });


}




// ============================================================
// SEARCH REPORTS
// ============================================================


if (reportSearchInput) {


  reportSearchInput.addEventListener(
    "input",
    () => {


      const searchTerm =
        reportSearchInput.value
          .trim()
          .toLowerCase();


      if (!searchTerm) {


        renderMunicipalReports(
          municipalReports
        );


        return;
      }


      const filteredReports =
        municipalReports.filter(report => {


          const reportId =
            String(
              report.report_id ?? ""
            ).toLowerCase();


          const title =
            String(
              report.title ?? ""
            ).toLowerCase();


          const commodity =
            String(
              report.commodity ?? ""
            ).toLowerCase();


          const plantingDate =
            String(
              report.planting_date ?? ""
            ).toLowerCase();


          const yieldValue =
            String(
              report.estimated_yield ?? ""
            ).toLowerCase();


          return (
            reportId.includes(searchTerm) ||
            title.includes(searchTerm) ||
            commodity.includes(searchTerm) ||
            plantingDate.includes(searchTerm) ||
            yieldValue.includes(searchTerm)
          );


        });


      renderMunicipalReports(
        filteredReports
      );


    }
  );


}




// ============================================================
// DATE FORMAT
// ============================================================


function formatDate(dateString) {


  if (!dateString) {
    return "—";
  }


  const date =
    new Date(dateString);


  if (isNaN(date.getTime())) {
    return dateString;
  }


  return date.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric"
    }
  );


}




// ============================================================
// OPEN REPORT DETAIL
// ============================================================


function openReportDetail(report) {


  selectedReport = report;


  // Hide pending list
  pendingReportsView.style.display =
    "none";


  // Show detail
  individualDetailView.style.display =
    "block";


  // Reset buttons
  flagBtn.classList.remove("active");
  flagBtn.textContent =
    "Flag for Revision";


  approveBtn.classList.remove("active");
  approveBtn.textContent =
    "Approve";


  // Fill report details
  reportDetailBody.innerHTML = `


    <tr>


      <td>
        <span class="pill">
          ${report.commodity || "—"}
        </span>
      </td>


      <td>
        <span class="pill">
          ${formatDate(
            report.planting_date
          )}
        </span>
      </td>


      <td>
        <span class="pill">
          ${formatDate(
            report.harvest_date
          )}
        </span>
      </td>


      <td>
        <span class="pill">
          ${report.estimated_yield ?? "—"}
        </span>
      </td>


      <td>
        <span class="pill">
          ${report.encoded_by_name || "—"}
        </span>
      </td>


      <td>
        <span class="status-pill pending">
          For Municipal Validation
        </span>
      </td>


    </tr>


  `;


  // Notes
  reportNotesTextarea.value =
    report.notes ||
    report.narrative ||
    "";


  // Remarks
  remarksTextarea.value =
    report.revision_remarks ||
    "";


  // Scroll to top of reports
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


}




// ============================================================
// RETURN TO PENDING LIST
// ============================================================


backToPendingBtn.addEventListener(
  "click",
  () => {


    selectedReport = null;


    individualDetailView.style.display =
      "none";


    pendingReportsView.style.display =
      "block";


    flagBtn.classList.remove("active");
    flagBtn.textContent =
      "Flag for Revision";


    approveBtn.classList.remove("active");
    approveBtn.textContent =
      "Approve";


  }
);



// ============================================================
// FLAG FOR REVISION - WITH ACTUAL API CALL
// ============================================================

flagBtn.addEventListener("click", async () => {

  if (!selectedReport) {
    return;
  }

  // Disable button
  flagBtn.disabled = true;
  flagBtn.textContent = "Processing...";

  try {
    const reportId = selectedReport.report_id;
    const remarks = remarksTextarea.value.trim() || "Revision needed. Please update the report.";

    // I-send ang FLAG request sa backend
    const response = await fetch(
      `${API_BASE_URL}/api/report-submissions/${reportId}/flag`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          status: "revision_requested",
          remarks: remarks,
          action: "flag"
        })
      }
    );

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.detail || `Failed to flag report. Status: ${response.status}`);
    }

    const result = await response.json();
    console.log("Flag result:", result);

    // Update local data
    selectedReport.status = "revision_requested";
    selectedReport.revision_remarks = remarks;

    // Update button appearance
    flagBtn.classList.add("active");
    flagBtn.textContent = "Flagged ✓";

    // I-update ang status sa detail view
    const statusCell = document.querySelector("#reportDetailBody td:last-child .status-pill");
    if (statusCell) {
      statusCell.className = "status-pill pending";
      statusCell.textContent = "Revision Requested";
    }

    openModal("Report Flagged for Revision");

    // I-reload ang pending reports list
    await loadMunicipalReports();

  } catch (error) {
    console.error("Error flagging report:", error);
    openModal(`Error: ${error.message}`);
    
    flagBtn.classList.remove("active");
    flagBtn.textContent = "Flag for Revision";
  } finally {
    flagBtn.disabled = false;
  }

});
// ============================================================
// APPROVE REPORT - WITH ACTUAL API CALL
// ============================================================

approveBtn.addEventListener("click", async () => {

  if (!selectedReport) {
    return;
  }

  approveBtn.disabled = true;
  approveBtn.textContent = "Processing...";

  try {

    // ============================================================
    // GET LOGGED-IN USER
    // ============================================================

    const currentUser = JSON.parse(
      localStorage.getItem("user") || "{}"
    );

    const validatorId = currentUser.user_id;

    if (!validatorId) {
      throw new Error(
        "No logged-in user found. Please log in again."
      );
    }

    console.log("Current validator ID:", validatorId);

    // ============================================================
    // REPORT DATA
    // ============================================================

    const reportId = selectedReport.report_id;

    const remarks =
      remarksTextarea.value.trim() ||
      "Approved by Municipal Coordinator";

    // ============================================================
    // APPROVE API
    // ============================================================

    const approveUrl =
      `${API_BASE_URL}/api/report-submissions/${reportId}/approve` +
      `?validator_id=${validatorId}` +
      `&validator_role=municipal_coordinator` +
      `&remarks=${encodeURIComponent(remarks)}`;

    console.log("Approve URL:", approveUrl);

    const response = await fetch(
      approveUrl,
      {
        method: "POST",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    // ============================================================
    // HANDLE ERROR
    // ============================================================

    if (!response.ok) {

      const errorData =
        await response.json().catch(() => ({}));

      throw new Error(
        errorData.detail ||
        `Failed to approve report. Status: ${response.status}`
      );
    }

    // ============================================================
    // SUCCESS RESPONSE
    // ============================================================

    const result = await response.json();

    console.log("Approve result:", result);

    // ============================================================
    // UPDATE LOCAL DATA
    // ============================================================

    selectedReport.status =
      "FOR_PROVINCIAL_VALIDATION";

    selectedReport.revision_remarks =
      remarks;

    // ============================================================
    // UPDATE BUTTON
    // ============================================================

    approveBtn.classList.add("active");
    approveBtn.textContent = "Approved ✓";

    // ============================================================
    // UPDATE STATUS IN DETAIL VIEW
    // ============================================================

    const statusCell =
      document.querySelector(
        "#reportDetailBody td:last-child .status-pill"
      );

    if (statusCell) {

      statusCell.className =
        "status-pill approved";

      statusCell.textContent =
        "For Provincial Validation";
    }

    // ============================================================
    // SUCCESS MODAL
    // ============================================================

    openModal(
      "Report Approved Successfully"
    );

    // ============================================================
    // RELOAD REPORT LIST
    // ============================================================

    await loadMunicipalReports();

  } catch (error) {

    console.error(
      "Error approving report:",
      error
    );

    openModal(
      `Error: ${error.message}`
    );

    approveBtn.classList.remove("active");
    approveBtn.textContent = "Approve";

  } finally {

    approveBtn.disabled = false;

  }

});

// ============================================================
// SUBMIT REPORT TO PROVINCIAL LEVEL
// ============================================================


const submitReportToProvBtn =
  document.getElementById(
    "submitReportToProvBtn"
  );


if (submitReportToProvBtn) {


  submitReportToProvBtn.addEventListener(
    "click",
    () => {


      openModal(
        "Report Submitted to Provincial Level"
      );


    }
  );


}




// ============================================================
// MODAL
// ============================================================


const reportModal =
  document.getElementById(
    "reportModal"
  );


const reportModalText =
  document.getElementById(
    "reportModalText"
  );


const reportModalConfirmBtn =
  document.getElementById(
    "reportModalConfirmBtn"
  );




function openModal(message) {


  reportModalText.textContent =
    message;


  reportModal.classList.add(
    "show"
  );


}




reportModalConfirmBtn.addEventListener(
  "click",
  () => {


    reportModal.classList.remove(
      "show"
    );


  }
);




// ============================================================
// LOAD REPORTS WHEN PAGE OPENS
// ============================================================


loadMunicipalReports();


</script>
