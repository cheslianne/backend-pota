<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Forgot Password — eSaka</title>


<!-- Modern Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="assets/css/base.css">


<style>
  :root {
    --cream: #F2EDE1;
    --white: #FBF8F1;
    --ink: #2E2A22;
    --muted: #625E52;
    --border: #DFD8C6;
    --border-light: #ECE5D4;
    --green: #5B6B4F;
    --green-dark: #445439;
    --green-light: #E7EDDF;
    --brown: #C08A4E;
    --error: #A51D24;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }


  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }


  html,
  body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--ink);
    background:
      linear-gradient(rgba(46, 60, 40, 0.65), rgba(46, 60, 40, 0.75)),
      url('images/esakapic.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }


  .frame {
    width: 95%;
    max-width: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
  }


  .page-inner {
    width: 100%;
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 50px rgba(20, 35, 15, 0.35);
    padding: 46px 52px 42px;
    animation: fadeIn 0.3s ease-in-out;
  }


  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }


  /* --- BRAND LOGOS --- */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }


  .brand-logo-img {
    height: 80px;
    width: auto;
    object-fit: contain;
    display: block;
  }


  .brand-name-img {
    height: 82px;
    width: auto;
    object-fit: contain;
    display: block;
  }


  /* --- CARD INNER --- */
  .card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 38px 44px 32px;
  }


  .card h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--green);
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 8px;
  }


  .card .sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 28px;
  }


  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
  }


  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }


  .field input {
    width: 100%;
    padding: 13px 18px;
    font-size: 14.5px;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }


  .field input::placeholder {
    color: #9a9385;
  }


  .field input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3.5px rgba(91, 107, 79, 0.16);
  }


  .field input.invalid {
    border-color: var(--error);
  }


  .error-msg {
    display: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--error);
    margin-top: 6px;
  }


  .field.has-error .error-msg {
    display: block;
  }


  .button-group {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }


  .btn-back,
  .btn-send {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }


  .btn-back {
    flex: 1;
    border: 1.5px solid var(--border);
    background: #FFFFFF;
    color: var(--ink);
  }


  .btn-back:hover {
    background: var(--cream);
    border-color: var(--green);
  }


  .btn-send {
    flex: 2;
    border: none;
    background: var(--green);
    color: #fff;
  }


  .btn-send:hover {
    background: var(--green-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(68, 84, 57, 0.25);
  }


  .btn-send:active,
  .btn-back:active {
    transform: translateY(0);
  }


  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }


  .home-row {
    text-align: center;
    margin-top: 14px;
  }


  .home-row a {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }


  .home-row a:hover {
    color: var(--green);
    text-decoration: underline;
  }


  /* --- MODALS --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 35, 28, 0.65);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    z-index: 99999;
  }


  .modal-overlay.show {
    display: flex;
  }


  .modal-box {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 38px 48px 34px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    max-width: 480px;
    width: calc(100% - 40px);
  }


  .modal-box h2 {
    font-size: 22px;
    font-weight: 800;
    color: var(--green);
    margin-bottom: 12px;
  }


  .modal-box p {
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 24px;
    line-height: 1.5;
  }


  .modal-ok {
    border: none;
    background: var(--green);
    color: #fff;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 36px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease;
  }


  .modal-ok:hover {
    background: var(--green-dark);
  }


  @media (max-width: 640px) {
    .page-inner {
      padding: 32px 22px 28px;
    }
    .card {
      padding: 28px 20px 24px;
    }
    .brand-logo-img {
      height: 64px;
    }
    .brand-name-img {
      height: 66px;
    }
    .card h1 {
      font-size: 20px;
    }
    .button-group {
      flex-direction: column-reverse;
    }
  }
</style>
</head>


<body>


<div class="frame">
  <div class="page-inner">


    <!-- BRAND LOGOS -->
    <div class="brand">
      <img src="images/esakalogo.png" alt="eSaka Logo" class="brand-logo-img">
      <img src="images/esakaname.png" alt="eSaka" class="brand-name-img">
    </div>


    <!-- CARD -->
    <div class="card">
      <h1>Forgot Password</h1>
      <p class="sub">
        Enter your registered email address and we'll send you a password reset link.
      </p>


      <form id="resetForm" novalidate>
        <div class="field" id="emailField">
          <label for="resetEmail">Email Address</label>
          <input
            type="email"
            id="resetEmail"
            placeholder="e.g. user@organization.com"
            autocomplete="email"
          >
          <p class="error-msg" id="emailError">
            Please enter a valid email address.
          </p>
        </div>


        <div class="button-group">
          <button type="button" class="btn-back" id="backToLoginBtn">
            Back to Login
          </button>
          <button class="btn-send" id="sendButton" type="submit">
            Send Reset Link
          </button>
        </div>


        <div class="home-row">
          <a href="index.html">Return to Homescreen</a>
        </div>
      </form>
    </div>


  </div>
</div>


<!-- EMAIL SENT MODAL -->
<div class="modal-overlay" id="sentModal">
  <div class="modal-box">
    <h2>Email Sent!</h2>
    <p>
      Please check your inbox for instructions to reset your password.
    </p>
    <button class="modal-ok" id="modalOkBtn" type="button">
      OK
    </button>
  </div>
</div>


<script>
  const API_BASE_URL = "http://127.0.0.1:8000";


  const resetForm = document.getElementById("resetForm");
  const emailField = document.getElementById("emailField");
  const resetEmail = document.getElementById("resetEmail");
  const sentModal = document.getElementById("sentModal");
  const sendButton = document.getElementById("sendButton");
  const backToLoginBtn = document.getElementById("backToLoginBtn");


  // Back button event listener
  backToLoginBtn.addEventListener("click", function() {
    window.location.href = "login.html";
  });


  // Submit reset form
  resetForm.addEventListener("submit", async function(event) {
    event.preventDefault();


    const email = resetEmail.value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!email || !emailPattern.test(email)) {
      emailField.classList.add("has-error");
      resetEmail.classList.add("invalid");
      return;
    }


    emailField.classList.remove("has-error");
    resetEmail.classList.remove("invalid");


    sendButton.disabled = true;
    sendButton.textContent = "Sending...";


    try {
      const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email_address: email
        })
      });


      let data = {};
      try {
        data = await response.json();
      } catch (parseError) {
        data = {};
      }


      if (!response.ok) {
        const detail = data.detail;
        const validationMessage = Array.isArray(detail)
          ? detail.map(error => error.msg).join(" ")
          : detail;
        alert(validationMessage || "Unable to send password reset email.");
        return;
      }


      sentModal.classList.add("show");


    } catch (error) {
      console.error("Forgot password error:", error);
      alert("Unable to connect to the eSaka server.");
    } finally {
      sendButton.disabled = false;
      sendButton.textContent = "Send Reset Link";
    }
  });


  document.getElementById("modalOkBtn").addEventListener("click", function() {
    window.location.href = "login.html";
  });
</script>


</body>
</html>
