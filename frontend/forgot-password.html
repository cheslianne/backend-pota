<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — eSaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EDE1;
    --ink:#2E2A22;
    --green:#5B6B4F;
    --green-dark:#495a3f;
    --brown:#8C6A4A;
    --gold:#C9A15A;
    --error:#A6453C;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100vh;
    font-family:'Inter', sans-serif;
    background:var(--green);
    color:var(--ink);
  }

  .frame{
    min-height:100vh;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green);
  }

  .page-inner{
    width:100%;
    max-width:640px;
    background:var(--cream);
    padding:36px 40px 50px;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:26px;
  }

  .brand svg{ width:110px; height:96px; flex-shrink:0; }

  .brand-word{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:46px;
    color:var(--green);
    line-height:1;
    margin-left:-12px;
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,0.2));
  }

  .card{
    background:#D8D5CD;
    max-width:465px;
    margin:0 auto;
    padding:28px 32px 26px;
    border-radius:4px;
    box-shadow:0 12px 28px rgba(0,0,0,0.15);
  }

  .card h1{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }

  .card .sub{
    font-size:12px;
    color:#6b6656;
    margin-bottom:22px;
  }

  .field label{
    display:block;
    font-size:15px;
    color:var(--ink);
    margin-bottom:8px;
  }

  .field input{
    width:100%;
    padding:11px 14px;
    font-size:14px;
    font-family:'Inter', sans-serif;
    border:1.5px solid var(--ink);
    border-radius:4px;
    background:#F4F2ED;
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }

  .field input::placeholder{ color:#9a9385; }

  .field input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(91,107,79,0.15);
  }

  .field input.invalid{ border-color:var(--error); }

  .error-msg{
    display:none;
    font-size:12px;
    color:var(--error);
    margin-top:5px;
  }

  .field.has-error .error-msg{ display:block; }

  .send-row{
    display:flex;
    justify-content:center;
    margin-top:24px;
  }

  .btn-send{
    appearance:none;
    border:1.5px solid var(--green);
    background:var(--green);
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:9px 26px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .2s ease, transform .15s ease;
  }

  .btn-send:hover{ background:var(--green-dark); }
  .btn-send:active{ transform:translateY(1px); }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(30,35,28,0.55);
    align-items:center;
    justify-content:center;
    z-index:50;
  }

  .modal-overlay.show{ display:flex; }

  .modal-box{
    background:#D8D5CD;
    border-radius:4px;
    padding:32px 46px 28px;
    text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,0.3);
    max-width:340px;
  }

  .modal-box h2{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--green);
    margin-bottom:18px;
  }

  .modal-box p{
    font-size:14px;
    color:var(--ink);
    margin-bottom:22px;
  }

  .modal-ok{
    border:1.5px solid var(--green);
    background:var(--green);
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 30px;
    border-radius:4px;
    cursor:pointer;
  }

  .modal-ok:hover{ background:var(--green-dark); }

  @media (max-width: 520px){
    .page-inner{ padding:26px 18px 34px; }
    .card{ padding:24px 22px 22px; max-width:100%; }
    .brand svg{ width:80px; height:70px; }
    .brand-word{ font-size:34px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="page-inner">

    <div class="brand">
      <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#8C6A4A" stroke-width="2.5" stroke-linecap="round">
          <path d="M8 90 C 40 40, 90 20, 150 15"/>
          <path d="M8 90 C 45 55, 95 40, 155 45"/>
          <path d="M8 90 C 50 78, 100 72, 158 82"/>
          <path d="M8 90 C 45 105, 95 118, 150 130"/>
          <path d="M8 90 C 40 130, 85 150, 130 158"/>
        </g>
        <g fill="none" stroke="#C9A15A" stroke-width="1.5" opacity="0.7">
          <path d="M160 12 c 6 4, 10 10, 8 18"/>
        </g>
      </svg>
      <span class="brand-word">eSaka</span>
    </div>

    <div class="card">
      <h1>Forgot Password</h1>
      <p class="sub">We'll send a link that will sign you into the app instantly.</p>

      <form id="resetForm" novalidate>
        <div class="field" id="emailField">
          <label for="resetEmail">Email</label>
          <input type="text" id="resetEmail" placeholder="Enter Email">
          <p class="error-msg" id="emailError">Enter your email or mobile number.</p>
        </div>

        <div class="send-row">
          <button class="btn-send" type="submit">Send Email</button>
        </div>
      </form>
    </div>

  </div>
</div>

<!-- ===== Email Sent Modal ===== -->
<div class="modal-overlay" id="sentModal">
  <div class="modal-box">
    <h2>Email Sent!</h2>
    <p>Get Back to Sign In page to continue</p>
    <button class="modal-ok" id="modalOkBtn">Ok</button>
  </div>
</div>

<script>
  const resetForm = document.getElementById('resetForm');
  const emailField = document.getElementById('emailField');
  const resetEmail = document.getElementById('resetEmail');
  const sentModal = document.getElementById('sentModal');

  resetForm.addEventListener('submit', (e) => {
    e.preventDefault();

    if (resetEmail.value.trim() === ''){
      emailField.classList.add('has-error');
      resetEmail.classList.add('invalid');
      return;
    }

    emailField.classList.remove('has-error');
    resetEmail.classList.remove('invalid');

    // TODO: replace nalang nung sa real request para sa trigger sa password reset email
    sentModal.classList.add('show');
  });

  document.getElementById('modalOkBtn').addEventListener('click', () => {
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
