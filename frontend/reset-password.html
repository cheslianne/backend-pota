<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password — eSaka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --cream:#F2EDE1;
  --ink:#2E2A22;
  --green:#5B6B4F;
  --green-dark:#495a3f;
  --error:#A6453C;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100vh;
  font-family:'Inter',sans-serif;
  background:var(--green);
  color:var(--ink);
}

.frame{
  min-height:100vh;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green);
}

.page-inner{
  width:100%;
  max-width:640px;
  background:var(--cream);
  padding:36px 40px 50px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:26px;
}

.brand svg{
  width:110px;
  height:96px;
}

.brand-word{
  font-family:'Dancing Script',cursive;
  font-weight:700;
  font-size:46px;
  color:var(--green);
  line-height:1;
  margin-left:-12px;
  filter:drop-shadow(
    1px 2px 1px rgba(0,0,0,0.2)
  );
}

.card{
  background:#D8D5CD;
  max-width:465px;
  margin:0 auto;
  padding:28px 32px 30px;
  border-radius:4px;
  box-shadow:
    0 12px 28px rgba(0,0,0,0.15);
}

.card h1{
  font-size:19px;
  font-weight:700;
  margin-bottom:4px;
}

.card .sub{
  font-size:12px;
  color:#6b6656;
  margin-bottom:22px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  font-size:15px;
  margin-bottom:8px;
}

.field input{
  width:100%;
  padding:11px 14px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  border:1.5px solid var(--ink);
  border-radius:4px;
  background:#F4F2ED;
  color:var(--ink);
  outline:none;
}

.field input:focus{
  border-color:var(--green);
  box-shadow:
    0 0 0 3px rgba(91,107,79,0.15);
}

.field input.invalid{
  border-color:var(--error);
}

.error-msg{
  display:none;
  font-size:12px;
  color:var(--error);
  margin-top:5px;
}

.field.has-error .error-msg{
  display:block;
}

.button-row{
  display:flex;
  justify-content:center;
  margin-top:24px;
}

.btn-reset{
  border:1.5px solid var(--green);
  background:var(--green);
  color:white;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:500;
  padding:9px 26px;
  border-radius:4px;
  cursor:pointer;
}

.btn-reset:hover{
  background:var(--green-dark);
}

.btn-reset:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  text-align:center;
  margin-top:18px;
  font-size:13px;
}

.message.success{
  display:block;
  color:var(--green);
}

.message.error{
  display:block;
  color:var(--error);
}

@media(max-width:520px){

  .page-inner{
    padding:26px 18px 34px;
  }

  .card{
    padding:24px 22px 22px;
    max-width:100%;
  }

  .brand svg{
    width:80px;
    height:70px;
  }

  .brand-word{
    font-size:34px;
  }

}

</style>

</head>

<body>


<div class="frame">

  <div class="page-inner">


    <!-- BRAND -->

    <div class="brand">

      <svg
        viewBox="0 0 200 170"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <g
          fill="none"
          stroke="#8C6A4A"
          stroke-width="2.5"
          stroke-linecap="round"
        >

          <path d="M8 90 C 40 40, 90 20, 150 15"/>
          <path d="M8 90 C 45 55, 95 40, 155 45"/>
          <path d="M8 90 C 50 78, 100 72, 158 82"/>
          <path d="M8 90 C 45 105, 95 118, 150 130"/>
          <path d="M8 90 C 40 130, 85 150, 130 158"/>

        </g>

      </svg>

      <span class="brand-word">
        eSaka
      </span>

    </div>


    <!-- CARD -->

    <div class="card">

      <h1>
        Reset Password
      </h1>

      <p class="sub">
        Enter your new password below.
      </p>


      <form id="resetPasswordForm">


        <!-- NEW PASSWORD -->

        <div
          class="field"
          id="newPasswordField"
        >

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            placeholder="Enter New Password"
            autocomplete="new-password"
          >

          <p
            class="error-msg"
            id="newPasswordError"
          >
            Please enter a new password.
          </p>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div
          class="field"
          id="confirmPasswordField"
        >

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            autocomplete="new-password"
          >

          <p
            class="error-msg"
            id="confirmPasswordError"
          >
            Passwords do not match.
          </p>

        </div>


        <div class="button-row">

          <button
            type="submit"
            class="btn-reset"
            id="resetButton"
          >
            Reset Password
          </button>

        </div>


        <p
          class="message"
          id="message"
        ></p>


      </form>

    </div>

  </div>

</div>


<script>

  // =========================================================
  // API
  // =========================================================

  const API_BASE_URL =
    "http://127.0.0.1:8000";


  // =========================================================
  // GET TOKEN FROM URL
  // =========================================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("token");


  // =========================================================
  // ELEMENTS
  // =========================================================

  const form =
    document.getElementById(
      "resetPasswordForm"
    );

  const newPassword =
    document.getElementById(
      "newPassword"
    );

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    );

  const newPasswordField =
    document.getElementById(
      "newPasswordField"
    );

  const confirmPasswordField =
    document.getElementById(
      "confirmPasswordField"
    );

  const resetButton =
    document.getElementById(
      "resetButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  // =========================================================
  // CHECK TOKEN
  // =========================================================

  if(!token){

    resetButton.disabled = true;

    message.textContent =
      "Invalid password reset link.";

    message.className =
      "message error";

  }


  // =========================================================
  // RESET PASSWORD
  // =========================================================

  form.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      // -----------------------------------------------------
      // RESET VALIDATION
      // -----------------------------------------------------

      newPasswordField
        .classList.remove("has-error");

      confirmPasswordField
        .classList.remove("has-error");


      const password =
        newPassword.value.trim();

      const confirm =
        confirmPassword.value.trim();


      // -----------------------------------------------------
      // EMPTY PASSWORD
      // -----------------------------------------------------

      if(!password){

        newPasswordField
          .classList.add("has-error");

        return;
      }


      // -----------------------------------------------------
      // PASSWORD MATCH
      // -----------------------------------------------------

      if(password !== confirm){

        confirmPasswordField
          .classList.add("has-error");

        return;
      }


      // -----------------------------------------------------
      // SEND REQUEST
      // -----------------------------------------------------

      resetButton.disabled = true;
      resetButton.textContent =
        "Resetting...";


      try{

        const response =
          await fetch(
            `${API_BASE_URL}/api/auth/reset-password`,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                token:token,
                new_password:password
              })
            }
          );


        const data =
          await response.json();


        // ---------------------------------------------------
        // ERROR
        // ---------------------------------------------------

        if(!response.ok){

          message.textContent =
            data.detail ||
            "Unable to reset password.";

          message.className =
            "message error";

          return;
        }


        // ---------------------------------------------------
        // SUCCESS
        // ---------------------------------------------------

        message.textContent =
          "Password reset successfully. Redirecting to login...";

        message.className =
          "message success";


        setTimeout(
          function(){

            window.location.href =
              "login.html";

          },
          2000
        );

      }

      catch(error){

        console.error(
          "Reset password error:",
          error
        );

        message.textContent =
          "Unable to connect to the eSaka server.";

        message.className =
          "message error";

      }

      finally{

        resetButton.disabled = false;

        resetButton.textContent =
          "Reset Password";

      }

    }
  );

</script>

</body>
</html>
