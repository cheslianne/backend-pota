<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password — eSaka</title>
<script src="assets/js/config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --primary:#0B382A;
  --secondary:#14532D;
  --neutral:#202824;
  --surface:#FFFFFF;
  --border:#D9E4DE;
  --error:#C0392B;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100vh;
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow-x:hidden;
  color:var(--neutral);
}

.frame{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(217,228,222,.8);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(11,56,42,.3);
  position:relative;
  z-index:1;
}

.page-inner{
  width:100%;
  padding-top:28px;
  background:linear-gradient(
    to bottom,
    rgba(11,56,42,.68) 0,
    rgba(11,56,42,.68) 280px,
    transparent 280px
  );
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
}

.brand-logo{
  display:block;
  width:150px;
  height:92px;
  object-fit:contain;
  filter:brightness(0) invert(1);
}

.page-inner::before{
  display:none;
}

.card{
  position:relative;
  z-index:1;
  background:rgba(255,255,255,.76);
  margin:0 26px 26px;
  padding:28px 24px 24px;
  border:1px solid rgba(217,228,222,.75);
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.card h1{
  position:absolute;
  top:-57px;
  left:0;
  width:100%;
  color:#ffffff;
  text-align:center;
  font-size:24px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:-.01em;
  text-transform:uppercase;
  margin:0;
}

.card .sub{
  position:absolute;
  top:-22px;
  left:24px;
  right:24px;
  text-align:center;
  font-size:13px;
  line-height:1.5;
  color:var(--neutral);
  margin:0;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  color:var(--secondary);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
}

.field input{
  width:100%;
  padding:11px 14px;
  font-size:13px;
  font-family:'Plus Jakarta Sans',sans-serif;
  border:1.5px solid rgba(32,40,36,.22);
  border-radius:10px;
  background:var(--surface);
  color:var(--neutral);
  outline:none;
}

.field input:focus{
  border-color:var(--primary);
  box-shadow:
    0 0 0 3px rgba(11,56,42,.14);
}

.field input.invalid{
  border-color:var(--error);
}

.error-msg{
  display:none;
  font-size:12px;
  color:var(--error);
  margin-top:5px;
}

.field.has-error .error-msg{
  display:block;
}

.button-row{
  display:flex;
  justify-content:flex-end;
  margin-top:20px;
}

.btn-reset{
  border:1.5px solid var(--primary);
  background:var(--primary);
  color:white;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;
  font-weight:700;
  padding:12px 24px;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 8px 16px rgba(11,56,42,.18);
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.btn-reset:hover{
  background:var(--secondary);
  transform:translateY(-1px);
  box-shadow:0 10px 20px rgba(11,56,42,.24);
}

.btn-reset:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  text-align:center;
  margin-top:16px;
  font-size:13px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    url('images/esakabg.jpg') center/cover,
    url('images/esakabg2.jpg') center/cover;
}

.message.success{
  display:block;
  color:var(--secondary);
}

.message.error{
  display:block;
  color:var(--error);
}

@media(max-width:520px){

  .page-inner{
    padding-top:20px;
  }

  .card{
    margin-left:18px;
    margin-right:18px;
    padding-left:22px;
    padding-right:22px;
  }

  .brand-logo{
    width:150px;
    height:84px;
  }

  .card h1{
    font-size:21px;
    margin-left:-22px;
    margin-right:-22px;
  }

}

</style>

</head>

<body>


<div class="frame">

  <div class="page-inner">


    <!-- BRAND -->

    <div class="brand">
      <img
        src="images/reset-logo.png"
        alt="eSaka"
        class="brand-logo"
      >
    </div>


    <!-- CARD -->

    <div class="card">

      <h1>
        Reset Password
      </h1>

      <p class="sub">
        Enter your new password below.
      </p>


      <form id="resetPasswordForm">


        <!-- NEW PASSWORD -->

        <div
          class="field"
          id="newPasswordField"
        >

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            placeholder="Enter New Password"
            autocomplete="new-password"
          >

          <p
            class="error-msg"
            id="newPasswordError"
          >
            Please enter a new password.
          </p>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div
          class="field"
          id="confirmPasswordField"
        >

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            autocomplete="new-password"
          >

          <p
            class="error-msg"
            id="confirmPasswordError"
          >
            Passwords do not match.
          </p>

        </div>


        <div class="button-row">

          <button
            type="submit"
            class="btn-reset"
            id="resetButton"
          >
            Reset Password
          </button>

        </div>


        <p
          class="message"
          id="message"
        ></p>


      </form>

    </div>

  </div>

</div>


<script>

  // =========================================================
  // API
  // =========================================================

  const API_BASE_URL =
    window.API_BASE_URL || "http://127.0.0.1:8000";


  // =========================================================
  // GET TOKEN FROM URL
  // =========================================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("token");


  // =========================================================
  // ELEMENTS
  // =========================================================

  const form =
    document.getElementById(
      "resetPasswordForm"
    );

  const newPassword =
    document.getElementById(
      "newPassword"
    );

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    );

  const newPasswordField =
    document.getElementById(
      "newPasswordField"
    );

  const confirmPasswordField =
    document.getElementById(
      "confirmPasswordField"
    );

  const resetButton =
    document.getElementById(
      "resetButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  // =========================================================
  // CHECK TOKEN
  // =========================================================

  if(!token){

    resetButton.disabled = true;

    message.textContent =
      "Invalid password reset link.";

    message.className =
      "message error";

  }


  // =========================================================
  // RESET PASSWORD
  // =========================================================

  form.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      // -----------------------------------------------------
      // RESET VALIDATION
      // -----------------------------------------------------

      newPasswordField
        .classList.remove("has-error");

      confirmPasswordField
        .classList.remove("has-error");


      const password =
        newPassword.value.trim();

      const confirm =
        confirmPassword.value.trim();


      // -----------------------------------------------------
      // EMPTY PASSWORD
      // -----------------------------------------------------

      if(!password){

        newPasswordField
          .classList.add("has-error");

        return;
      }


      // -----------------------------------------------------
      // PASSWORD MATCH
      // -----------------------------------------------------

      if(password !== confirm){

        confirmPasswordField
          .classList.add("has-error");

        return;
      }


      // -----------------------------------------------------
      // SEND REQUEST
      // -----------------------------------------------------

      resetButton.disabled = true;
      resetButton.textContent =
        "Resetting...";


      try{

        const response =
          await fetch(
            `${API_BASE_URL}/api/auth/reset-password`,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                token:token,
                new_password:password
              })
            }
          );


        const data =
          await response.json();


        // ---------------------------------------------------
        // ERROR
        // ---------------------------------------------------

        if(!response.ok){

          message.textContent =
            data.detail ||
            "Unable to reset password.";

          message.className =
            "message error";

          return;
        }


        // ---------------------------------------------------
        // SUCCESS
        // ---------------------------------------------------

        message.textContent =
          "Password reset successfully. Redirecting to login...";

        message.className =
          "message success";


        setTimeout(
          function(){

            window.location.href =
              "login.html";

          },
          2000
        );

      }

      catch(error){

        console.error(
          "Reset password error:",
          error
        );

        message.textContent =
          "Unable to connect to the eSaka server.";

        message.className =
          "message error";

      }

      finally{

        resetButton.disabled = false;

        resetButton.textContent =
          "Reset Password";

      }

    }
  );

</script>

</body>
</html>
