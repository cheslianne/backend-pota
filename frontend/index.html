<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eSaka — Tamang Presyo. Tamang Tanim. Tamang Kita.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream-bg: #FCFAF6;
    --ink: #1B2418;
    --muted: #4F5A49;
    --green-primary: #1C4D25;
    --green-dark: #14381b;
    --gold: #C9A15A;
  }




  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }




  html, body {
    width: 100%;
    height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }




  .landing-container {
    display: flex;
    width: 100vw;
    height: 100vh;
    position: relative;
    background-image: url('images/indexbg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }




  .content-side {
    margin-left: auto;
    width: 38%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px 24px 20px;
    z-index: 2;
    position: relative;
  }




  .main-column {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: auto;
    margin-bottom: auto;
  }




  .brand {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -50px;
    margin-bottom: 8px;
    padding-left: 28px;
  }




  .brand-logo-img {
    width: 78%;
    max-width: 340px;
    height: auto;
    object-fit: contain;
    display: block;
    transform: scale(1.15);
    transform-origin: center;
  }




  .hero-title {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--green-primary);
    letter-spacing: -0.025em;
    margin-bottom: 16px;
    width: 100%;
  }




  .hero-title span {
    color: var(--gold);
  }




  .description {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 28px;
    width: 100%;
  }




  .actions-group {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }




  .btn {
    appearance: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 30px;
    border-radius: 9px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 2px solid var(--green-primary);
    color: var(--green-primary);
  }




  .btn:hover {
    background: var(--green-primary);
    border-color: var(--green-primary);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(28, 77, 37, 0.2);
  }




  .btn:active {
    transform: translateY(0);
  }




  .footer-sub {
    font-size: 12px;
    color: #8c9388;
    align-self: center;
  }




  @media (max-width: 992px) {
    html, body {
      height: auto;
      overflow-y: auto;
    }
    .landing-container {
      background-position: top center;
      height: auto;
    }
    .content-side {
      width: 100%;
      height: auto;
      padding: 40px 24px;
      margin-left: 0;
      align-items: center;
    }
    .brand {
      margin-top: 0;
      padding-left: 0;
    }
    .hero-title {
      font-size: 32px;
    }
    .brand-logo-img {
      transform: scale(1);
      width: 60%;
    }
  }
</style>
</head>
<body>




<div class="landing-container">
  <div class="content-side">
    <div class="main-column">
      <div class="brand">
        <img src="images/esakaname.png" alt="eSaka Logo" class="brand-logo-img">
      </div>




      <h1 class="hero-title">Tamang Presyo. Tamang Tanim. <span>Tamang Kita.</span></h1>
     
      <p class="description">
        Pinag-uugnay ang mga magsasaka, AEW, at ang Department of Agriculture
        gamit ang real-time market data, planting intent coordination, at verified buyer matching.
      </p>




      <div class="actions-group">
        <button class="btn" type="button" id="loginBtn">Login</button>
        <button class="btn" type="button" id="registryBtn">Buyer Registry</button>
      </div>
    </div>




    <div class="footer-sub">
      <span>&copy; 2026 eSaka Platform</span>
    </div>
  </div>
</div>




<script>
  document.getElementById('loginBtn').addEventListener('click', () => {
    window.location.href = 'login.html';
  });




  document.getElementById('registryBtn').addEventListener('click', () => {
    window.location.href = 'buyer-registry.html';
  });
</script>




</body>
</html>
